<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Money Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

header {
    background: #ffffff;
    padding: 15px;
    text-align: center;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.header-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.header-buttons button {
    width: auto;
    margin: 0;
    padding: 8px 18px;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.card {
    background: white;
    padding: 12px 8px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card-title {
    font-size: 12px;
    color: #666;
}

.card-value {
    margin-top: 5px;
    font-size: 17px;
    font-weight: bold;
}

.section {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.section h2 {
    margin-top: 0;
    font-size: 18px;
}

input,
select,
textarea,
button {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
}

textarea {
    resize: vertical;
    min-height: 70px;
}

button {
    border: none;
    background: #1976d2;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.tabs button {
    margin: 0;
    background: #ddd;
    color: #333;
}

.tabs button.active {
    background: #1976d2;
    color: white;
}

.list-item {
    background: #f8f9fc;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border-left: 4px solid #1976d2;
}

.list-item strong {
    font-size: 16px;
}

.amount {
    font-size: 17px;
    font-weight: bold;
    margin-top: 5px;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.actions button {
    margin: 0;
    flex: 1;
}

.edit-btn {
    background: #f39c12;
}

.delete-btn {
    background: #e74c3c;
}

.hidden {
    display: none !important;
}

.category-badge {
    display: inline-block;
    background: #e8f5e9;
    color: #2e7d32;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 5px;
}

.search-box {
    margin-bottom: 10px;
}

.empty {
    text-align: center;
    color: #777;
    padding: 20px;
}

/* ---------- MODALS ---------- */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    padding: 20px;
    overflow: auto;
}

.modal-box {
    background: white;
    max-width: 600px;
    margin: 30px auto;
    border-radius: 16px;
    padding: 18px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-header h2 {
    margin: 0;
}

.close-btn {
    width: auto;
    margin: 0;
    background: #e74c3c;
    padding: 8px 14px;
}

.chart-tabs {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.chart-tabs button {
    margin: 0;
    flex: 1;
}

.chart-tabs button.active {
    background: #1976d2 !important;
}

.chart-area {
    margin-top: 20px;
    text-align: center;
}

.chart-legend {
    margin-top: 20px;
}

.category-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    margin-bottom: 8px;
    background: #f1f1f1;
    border-radius: 8px;
}

.category-row span {
    flex: 1;
}

.category-delete {
    width: auto;
    margin: 0;
    padding: 5px 10px;
    background: #e53935;
}

/* ---------- MOBILE ---------- */

@media (max-width: 500px) {

    .cards {
        grid-template-columns: repeat(3, 1fr);
    }

    .card-value {
        font-size: 14px;
    }

    .card-title {
        font-size: 10px;
    }

    .chart-tabs {
        gap: 5px;
    }

    .chart-tabs button {
        padding: 10px 5px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <h1>Money Tracker</h1>

    <div class="header-buttons">

        <button id="chartBtn">
            📊 চার্ট
        </button>

        <button id="categoryBtn">
            🏷️ Category
        </button>

    </div>

</header>


<!-- =========================================================
     CHART MODAL
========================================================= -->

<div id="chartModal" class="modal hidden">

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                খরচের চার্ট
            </h2>

            <button
                id="closeChartBtn"
                class="close-btn"
            >
                ✕
            </button>

        </div>


        <div class="chart-tabs">

            <button
                id="dailyChartBtn"
                class="active"
            >
                দৈনিক
            </button>

            <button
                id="monthlyChartBtn"
            >
                মাসিক
            </button>

            <button
                id="yearlyChartBtn"
            >
                বার্ষিক
            </button>

        </div>


        <div
            id="chartArea"
            class="chart-area"
        >
        </div>


        <div
            id="chartLegend"
            class="chart-legend"
        >
        </div>

    </div>

</div>


<!-- =========================================================
     CATEGORY MODAL
========================================================= -->

<div id="categoryModal" class="modal hidden">

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                🏷️ Category Management
            </h2>

            <button
                id="closeCategoryBtn"
                class="close-btn"
            >
                ✕
            </button>

        </div>


        <div style="margin-top:20px;">

            <input
                id="newCategoryInput"
                type="text"
                placeholder="নতুন Category লিখুন"
            >

            <button id="addCategoryBtn">
                ➕ Add Category
            </button>

        </div>


        <div style="margin-top:20px;">

            <h3>
                বর্তমান Categories
            </h3>

            <div id="categoryList">
            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     MAIN CONTAINER
========================================================= -->

<div class="container">


    <!-- SUMMARY CARDS -->

    <div class="cards">

        <div class="card">

            <div class="card-title">
                আজকের খরচ
            </div>

            <div
                class="card-value"
                id="todayExpense"
            >
                ₹0.00
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                এই মাসের আয়
            </div>

            <div
                class="card-value"
                id="monthIncome"
            >
                ₹0.00
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                ব্যালেন্স
            </div>

            <div
                class="card-value"
                id="balance"
            >
                ₹0.00
            </div>

        </div>

    </div>


    <!-- =====================================================
         TABS
    ====================================================== -->

    <div class="tabs">

        <button
            id="expenseTab"
            class="active"
        >
            খরচ
        </button>

        <button
            id="incomeTab"
        >
            আয়
        </button>

    </div>


    <!-- =====================================================
         EXPENSE SECTION
    ====================================================== -->

    <div
        id="expenseSection"
        class="section"
    >

        <h2>
            খরচ যোগ করুন
        </h2>


        <input
            type="date"
            id="expenseDate"
        >


        <select id="expenseCategory">

            <option value="">
                ক্যাটাগরি নির্বাচন করুন
            </option>

        </select>


        <input
            type="text"
            id="expenseItem"
            placeholder="কী কিনেছেন?"
        >


        <input
            type="number"
            id="expenseAmount"
            placeholder="টাকার পরিমাণ"
            min="0"
            step="0.01"
        >


        <textarea
            id="expenseNote"
            placeholder="নোট (ঐচ্ছিক)"
        ></textarea>


        <button id="saveExpenseBtn">
            খরচ যোগ করুন
        </button>


        <button
            id="cancelExpenseBtn"
            class="hidden"
            style="background:#777;"
        >
            বাতিল
        </button>


        <hr
            style="
                margin:20px 0;
                border:0;
                border-top:1px solid #ddd;
            "
        >


        <input
            type="text"
            id="expenseSearch"
            class="search-box"
            placeholder="খরচ খুঁজুন..."
        >


        <div id="expenseList">
        </div>

    </div>


    <!-- =====================================================
         INCOME SECTION
    ====================================================== -->

    <div
        id="incomeSection"
        class="section hidden"
    >

        <h2>
            আয় যোগ করুন
        </h2>


        <input
            type="date"
            id="incomeDate"
        >


        <input
            type="text"
            id="incomeItem"
            placeholder="আয়ের নাম"
        >


        <input
            type="number"
            id="incomeAmount"
            placeholder="টাকার পরিমাণ"
            min="0"
            step="0.01"
        >


        <textarea
            id="incomeNote"
            placeholder="নোট (ঐচ্ছিক)"
        ></textarea>


        <button id="saveIncomeBtn">
            আয় যোগ করুন
        </button>


        <button
            id="cancelIncomeBtn"
            class="hidden"
            style="background:#777;"
        >
            বাতিল
        </button>


        <hr
            style="
                margin:20px 0;
                border:0;
                border-top:1px solid #ddd;
            "
        >


        <input
            type="text"
            id="incomeSearch"
            class="search-box"
            placeholder="আয় খুঁজুন..."
        >


        <div id="incomeList">
        </div>

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

/* =========================================================
   DATA
========================================================= */

let expenses = JSON.parse(
    localStorage.getItem("moneyTrackerExpenses") || "[]"
);

let incomes = JSON.parse(
    localStorage.getItem("moneyTrackerIncomes") || "[]"
);

let categories = JSON.parse(
    localStorage.getItem("moneyTrackerCategories") || "null"
);


/* =========================================================
   DEFAULT CATEGORIES
========================================================= */

if (!Array.isArray(categories)) {

    categories = [
        "বাজার",
        "সবজি",
        "মাছ",
        "মাংস",
        "চাল / ডাল",
        "যাতায়াত",
        "বিদ্যুৎ",
        "মোবাইল",
        "বাড়ি",
        "অন্যান্য"
    ];

    localStorage.setItem(
        "moneyTrackerCategories",
        JSON.stringify(categories)
    );
}


/* =========================================================
   EDITING STATE
========================================================= */

let editingExpenseId = null;
let editingIncomeId = null;


/* =========================================================
   BASIC HELPERS
========================================================= */

function money(value) {

    return "₹" + Number(value || 0).toFixed(2);

}


function todayDate() {

    const d = new Date();

    const year = d.getFullYear();

    const month = String(
        d.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        d.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


function currentMonth() {

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0")
    );

}


function currentYear() {

    return String(
        new Date().getFullYear()
    );

}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   CATEGORY SELECT
========================================================= */

function populateCategorySelect() {

    const select =
        document.getElementById("expenseCategory");

    if (!select) return;

    select.innerHTML =
        '<option value="">ক্যাটাগরি নির্বাচন করুন</option>';

    categories.forEach(function(category) {

        const option =
            document.createElement("option");

        option.value = category;
        option.textContent = category;

        select.appendChild(option);

    });

}


/* =========================================================
   SUMMARY
========================================================= */

function updateSummary() {

    const today = todayDate();
    const month = currentMonth();

    let todayExpenseTotal = 0;
    let monthIncomeTotal = 0;
    let allIncomeTotal = 0;
    let allExpenseTotal = 0;


    expenses.forEach(function(expense) {

        const amount =
            Number(expense.amount) || 0;

        allExpenseTotal += amount;

        if (expense.date === today) {

            todayExpenseTotal += amount;

        }

    });


    incomes.forEach(function(income) {

        const amount =
            Number(income.amount) || 0;

        allIncomeTotal += amount;

        if (
            typeof income.date === "string" &&
            income.date.startsWith(month)
        ) {

            monthIncomeTotal += amount;

        }

    });


    const balance =
        allIncomeTotal - allExpenseTotal;


    document.getElementById(
        "todayExpense"
    ).textContent =
        money(todayExpenseTotal);


    document.getElementById(
        "monthIncome"
    ).textContent =
        money(monthIncomeTotal);


    document.getElementById(
        "balance"
    ).textContent =
        money(balance);

}


/* =========================================================
   DEFAULT DATES
========================================================= */

function setDefaultDates() {

    const today = todayDate();

    document.getElementById(
        "expenseDate"
    ).value = today;

    document.getElementById(
        "incomeDate"
    ).value = today;

}


/* =========================================================
   EXPENSE LIST
========================================================= */

function renderExpenses() {

    const list =
        document.getElementById("expenseList");

    const search =
        document.getElementById(
            "expenseSearch"
        ).value
        .trim()
        .toLowerCase();


    list.innerHTML = "";


    let filtered =
        expenses.filter(function(expense) {

            const text = (
                expense.item +
                " " +
                expense.category +
                " " +
                (expense.note || "")
            ).toLowerCase();

            return text.includes(search);

        });


    filtered.sort(function(a, b) {

        return b.date.localeCompare(a.date);

    });


    if (filtered.length === 0) {

        list.innerHTML =
            '<div class="empty">কোনো খরচ পাওয়া যায়নি।</div>';

        return;

    }


    filtered.forEach(function(expense) {

        const item =
            document.createElement("div");

        item.className = "list-item";


        item.innerHTML = `

            <strong>
                ${escapeHtml(expense.item)}
            </strong>

            <div>
                <span class="category-badge">
                    ${escapeHtml(expense.category)}
                </span>
            </div>

            <div style="margin-top:6px;">
                📅 ${escapeHtml(expense.date)}
            </div>

            <div class="amount">
                ${money(expense.amount)}
            </div>

            ${
                expense.note
                ? `
                    <div
                        style="
                            margin-top:5px;
                            color:#666;
                        "
                    >
                        ${escapeHtml(expense.note)}
                    </div>
                  `
                : ""
            }

            <div class="actions">

                <button
                    class="edit-btn"
                    onclick="editExpense(${expense.id})"
                >
                    Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteExpense(${expense.id})"
                >
                    Delete
                </button>

            </div>
        `;


        list.appendChild(item);

    });

}


/* =========================================================
   INCOME LIST
========================================================= */

function renderIncomes() {

    const list =
        document.getElementById("incomeList");

    const search =
        document.getElementById(
            "incomeSearch"
        ).value
        .trim()
        .toLowerCase();


    list.innerHTML = "";


    let filtered =
        incomes.filter(function(income) {

            const text = (
                income.item +
                " " +
                (income.note || "")
            ).toLowerCase();

            return text.includes(search);

        });


    filtered.sort(function(a, b) {

        return b.date.localeCompare(a.date);

    });


    if (filtered.length === 0) {

        list.innerHTML =
            '<div class="empty">কোনো আয় পাওয়া যায়নি।</div>';

        return;

    }


    filtered.forEach(function(income) {

        const item =
            document.createElement("div");

        item.className = "list-item";


        item.innerHTML = `

            <strong>
                ${escapeHtml(income.item)}
            </strong>

            <div style="margin-top:6px;">
                📅 ${escapeHtml(income.date)}
            </div>

            <div class="amount">
                ${money(income.amount)}
            </div>

            ${
                income.note
                ? `
                    <div
                        style="
                            margin-top:5px;
                            color:#666;
                        "
                    >
                        ${escapeHtml(income.note)}
                    </div>
                  `
                : ""
            }

            <div class="actions">

                <button
                    class="edit-btn"
                    onclick="editIncome(${income.id})"
                >
                    Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteIncome(${income.id})"
                >
                    Delete
                </button>

            </div>
        `;


        list.appendChild(item);

    });

}


/* =========================================================
   EXPENSE ACTIONS
========================================================= */

function saveExpense() {

    const date =
        document.getElementById(
            "expenseDate"
        ).value;

    const category =
        document.getElementById(
            "expenseCategory"
        ).value;

    const item =
        document.getElementById(
            "expenseItem"
        ).value.trim();

    const amount =
        parseFloat(
            document.getElementById(
                "expenseAmount"
            ).value
        );

    const note =
        document.getElementById(
            "expenseNote"
        ).value.trim();


    if (
        !date ||
        !category ||
        !item ||
        !amount ||
        amount <= 0
    ) {

        alert(
            "দয়া করে প্রয়োজনীয় সব তথ্য দিন।"
        );

        return;

    }


    if (editingExpenseId !== null) {

        const index =
            expenses.findIndex(
                function(expense) {
                    return (
                        expense.id ===
                        editingExpenseId
                    );
                }
            );


        if (index !== -1) {

            expenses[index] = {
                ...expenses[index],
                date,
                category,
                item,
                amount,
                note
            };

        }

    } else {

        expenses.push({

            id: Date.now(),

            date,

            category,

            item,

            amount,

            note

        });

    }


    localStorage.setItem(
        "moneyTrackerExpenses",
        JSON.stringify(expenses)
    );


    clearExpenseForm();

    renderExpenses();

    updateSummary();

}


/* =========================================================
   EDIT EXPENSE
========================================================= */

function editExpense(id) {

    const expense =
        expenses.find(
            function(item) {
                return item.id === id;
            }
        );


    if (!expense) return;


    document.getElementById(
        "expenseDate"
    ).value = expense.date;


    document.getElementById(
        "expenseCategory"
    ).value = expense.category;


    document.getElementById(
        "expenseItem"
    ).value = expense.item;


    document.getElementById(
        "expenseAmount"
    ).value = expense.amount;


    document.getElementById(
        "expenseNote"
    ).value = expense.note || "";


    editingExpenseId = id;


    document.getElementById(
        "saveExpenseBtn"
    ).textContent =
        "খরচ আপডেট করুন";


    document.getElementById(
        "cancelExpenseBtn"
    ).classList.remove("hidden");

}


/* =========================================================
   DELETE EXPENSE
========================================================= */

function deleteExpense(id) {

    if (
        !confirm(
            "এই খরচটি মুছে ফেলতে চান?"
        )
    ) {
        return;
    }


    expenses =
        expenses.filter(
            function(expense) {
                return expense.id !== id;
            }
        );


    localStorage.setItem(
        "moneyTrackerExpenses",
        JSON.stringify(expenses)
    );


    renderExpenses();

    updateSummary();

}


/* =========================================================
   CLEAR EXPENSE FORM
========================================================= */

function clearExpenseForm() {

    document.getElementById(
        "expenseDate"
    ).value = todayDate();


    document.getElementById(
        "expenseCategory"
    ).value = "";


    document.getElementById(
        "expenseItem"
    ).value = "";


    document.getElementById(
        "expenseAmount"
    ).value = "";


    document.getElementById(
        "expenseNote"
    ).value = "";


    editingExpenseId = null;


    document.getElementById(
        "saveExpenseBtn"
    ).textContent =
        "খরচ যোগ করুন";


    document.getElementById(
        "cancelExpenseBtn"
    ).classList.add("hidden");

}


/* =========================================================
   INCOME ACTIONS
========================================================= */

function saveIncome() {

    const date =
        document.getElementById(
            "incomeDate"
        ).value;

    const item =
        document.getElementById(
            "incomeItem"
        ).value.trim();

    const amount =
        parseFloat(
            document.getElementById(
                "incomeAmount"
            ).value
        );

    const note =
        document.getElementById(
            "incomeNote"
        ).value.trim();


    if (
        !date ||
        !item ||
        !amount ||
        amount <= 0
    ) {

        alert(
            "দয়া করে প্রয়োজনীয় সব তথ্য দিন।"
        );

        return;

    }


    if (editingIncomeId !== null) {

        const index =
            incomes.findIndex(
                function(income) {
                    return (
                        income.id ===
                        editingIncomeId
                    );
                }
            );


        if (index !== -1) {

            incomes[index] = {
                ...incomes[index],
                date,
                item,
                amount,
                note
            };

        }

    } else {

        incomes.push({

            id: Date.now(),

            date,

            item,

            amount,

            note

        });

    }


    localStorage.setItem(
        "moneyTrackerIncomes",
        JSON.stringify(incomes)
    );


    clearIncomeForm();

    renderIncomes();

    updateSummary();

}


/* =========================================================
   EDIT INCOME
========================================================= */

function editIncome(id) {

    const income =
        incomes.find(
            function(item) {
                return item.id === id;
            }
        );


    if (!income) return;


    document.getElementById(
        "incomeDate"
    ).value = income.date;


    document.getElementById(
        "incomeItem"
    ).value = income.item;


    document.getElementById(
        "incomeAmount"
    ).value = income.amount;


    document.getElementById(
        "incomeNote"
    ).value = income.note || "";


    editingIncomeId = id;


    document.getElementById(
        "saveIncomeBtn"
    ).textContent =
        "আয় আপডেট করুন";


    document.getElementById(
        "cancelIncomeBtn"
    ).classList.remove("hidden");

}


/* =========================================================
   DELETE INCOME
========================================================= */

function deleteIncome(id) {

    if (
        !confirm(
            "এই আয়টি মুছে ফেলতে চান?"
        )
    ) {
        return;
    }


    incomes =

                return income.id !== id;
            }
        );

    updateSummary();

}

/* =========================================================
   CATEGORY MANAGEMENT
========================================================= */

function renderCategories() {

    const list =
        document.getElementById(
            "categoryList"
        );


    if (!list) return;


    list.innerHTML = "";


    if (categories.length === 0) {

        list.innerHTML =
            '<div class="empty">কোনো Category নেই।</div>';

        return;

    }


    categories.forEach(
        function(category, index) {

            const row =
                document.createElement("div");

            row.className =
                "category-row";


            row.innerHTML = `

                <span>
                    ${escapeHtml(category)}
                </span>

                <button
                    class="category-delete"
                    onclick="deleteCategory(${index})"
                >
                    🗑️
                </button>

            `;


            list.appendChild(row);

        }
    );

}


/* =========================================================
   ADD CATEGORY
========================================================= */

function addCategory() {

    const input =
        document.getElementById(
            "newCategoryInput"
        );


    const name =
        input.value.trim();


    if (!name) {

        alert(
            "Category-এর নাম লিখুন।"
        );

        return;

    }


    const alreadyExists =
        categories.some(
            function(category) {
                return (
                    category.toLowerCase() ===
                    name.toLowerCase()
                );
            }
        );


    if (alreadyExists) {

        alert(
            "এই Category আগে থেকেই আছে।"
        );

        return;

    }


    categories.push(name);


    localStorage.setItem(
        "moneyTrackerCategories",
        JSON.stringify(categories)
    );


    input.value = "";


    populateCategorySelect();

    renderCategories();

}


/* =========================================================
   DELETE CATEGORY
========================================================= */

function deleteCategory(index) {

    const category =
        categories[index];


    if (
        !confirm(
            `"${category}" Category delete করবেন?`
        )
    ) {
        return;
    }


    categories.splice(index, 1);


    localStorage.setItem(
        "moneyTrackerCategories",
        JSON.stringify(categories)
    );


    populateCategorySelect();

    renderCategories();

}


/* =========================================================
   CHART COLORS
========================================================= */

const chartColors = [

    "#1976d2",
    "#e74c3c",
    "#2e7d32",
    "#f39c12",
    "#8e44ad",
    "#16a085",
    "#d35400",
    "#34495e",
    "#c0392b",
    "#7f8c8d"

];


/* =========================================================
   DAILY CHART DATA
========================================================= */

function getDailyChartData() {

    const today =
        todayDate();


    const totals = {};


    expenses.forEach(
        function(expense) {

            if (
                expense.date !== today
            ) {
                return;
            }


            const category =
                expense.category ||
                "অন্যান্য";


            const amount =
                Number(expense.amount) || 0;


            totals[category] =
                (totals[category] || 0) +
                amount;

        }
    );


    return Object.entries(totals)
        .map(
            function(entry) {

                return {

                    category: entry[0],

                    amount: entry[1]

                };

            }
        )
        .sort(
            function(a, b) {

                return b.amount - a.amount;

            }
        );

}


/* =========================================================
   PERIOD CHART DATA
========================================================= */

function getPeriodChartData(type) {

    const totals = {};


    const month =
        currentMonth();


    const year =
        currentYear();


    expenses.forEach(
        function(expense) {

            let include = false;


            if (type === "monthly") {

                include =
                    expense.date.startsWith(
                        month
                    );

            }


            if (type === "yearly") {

                include =
                    expense.date.startsWith(
                        year
                    );

            }


            if (!include) return;


            const category =
                expense.category ||
                "অন্যান্য";


            const amount =
                Number(expense.amount) || 0;


            totals[category] =
                (totals[category] || 0) +
                amount;

        }
    );


    return Object.entries(totals)
        .map(
            function(entry) {

                return {

                    category: entry[0],

                    amount: entry[1]

                };

            }
        )
        .sort(
            function(a, b) {

                return b.amount - a.amount;

            }
        );

}


/* =========================================================
   DRAW DAILY CHART
========================================================= */

function drawDailyChart() {

    const data =
        getDailyChartData();


    drawPieChart(
        data,
        "আজকের মোট খরচ"
    );

}


/* =========================================================
   DRAW PERIOD CHART
========================================================= */

function drawPeriodChart(type) {

    const data =
        getPeriodChartData(type);


    let title = "";


    if (type === "monthly") {

        title =
            "এই মাসের মোট খরচ";

    } else {

        title =
            "এই বছরের মোট খরচ";

    }


    drawPieChart(
        data,
        title
    );

}


/* =========================================================
   COMMON PIE CHART
========================================================= */

function drawPieChart(
    data,
    title
) {

    const chartArea =
        document.getElementById(
            "chartArea"
        );


    const legend =
        document.getElementById(
            "chartLegend"
        );


    if (data.length === 0) {

        chartArea.innerHTML =
            `<div class="empty">
                ${escapeHtml(title)} নেই।
            </div>`;


        legend.innerHTML = "";

        return;

    }


    const total =
        data.reduce(
            function(sum, item) {

                return sum + item.amount;

            },
            0
        );


    let current = 0;


    const parts =
        data.map(
            function(item, index) {

                const percentage =
                    (item.amount / total) *
                    100;


                const start =
                    current;


                current += percentage;


                const color =
                    chartColors[
                        index %
                        chartColors.length
                    ];


                return (
                    `${color} ` +
                    `${start}% ` +
                    `${current}%`
                );

            }
        );


    chartArea.innerHTML = `

        <div
            style="
                width:220px;
                height:220px;
                border-radius:50%;
                margin:20px auto;
                background:
                    conic-gradient(
                        ${parts.join(",")}
                    );
                position:relative;
            "
        >

            <div
                style="
                    position:absolute;
                    inset:45px;
                    background:white;
                    border-radius:50%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    text-align:center;
                    font-weight:bold;
                    font-size:17px;
                    padding:10px;
                "
            >
                ${money(total)}
            </div>

        </div>

        <div
            style="
                font-weight:bold;
                font-size:16px;
            "
        >
            ${escapeHtml(title)}
        </div>

    `;


    legend.innerHTML =
        data.map(
            function(item, index) {

                const percentage =
                    (
                        item.amount /
                        total
                    ) * 100;


                const color =
                    chartColors[
                        index %
                        chartColors.length
                    ];


                return `

                    <div
                        style="
                            display:flex;
                            align-items:center;
                            gap:8px;
                            padding:8px 0;
                            border-bottom:
                                1px solid #eee;
                        "
                    >

                        <span
                            style="
                                width:14px;
                                height:14px;
                                border-radius:50%;
                                background:${color};
                                display:inline-block;
                                flex-shrink:0;
                            "
                        ></span>


                        <span
                            style="flex:1;"
                        >
                            ${escapeHtml(
                                item.category
                            )}
                        </span>


                        <strong>
                            ${money(
                                item.amount
                            )}
                        </strong>


                        <span>
                            ${percentage.toFixed(1)}%
                        </span>

                    </div>

                `;

            }
        ).join("");

}


/* =========================================================
   CHART ACTIVE BUTTON
========================================================= */

function setChartActive(buttonId) {

    document.querySelectorAll(
        "#dailyChartBtn, " +
        "#monthlyChartBtn, " +
        "#yearlyChartBtn"
    ).forEach(
        function(button) {

            button.classList.remove(
                "active"
            );

            button.style.background =
                "#777";

        }
    );


    const activeButton =
        document.getElementById(
            buttonId
        );


    if (activeButton) {

        activeButton.classList.add(
            "active"
        );

        activeButton.style.background =
            "#1976d2";

    }

}
