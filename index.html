<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Money Tracker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #222;
}

header {
    background: #ffffff;
    padding: 15px;
    text-align: center;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.card {
    background: white;
    padding: 12px 8px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card-title {
    font-size: 12px;
    color: #666;
}

.card-value {
    margin-top: 5px;
    font-size: 17px;
    font-weight: bold;
}

.section {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.section h2 {
    margin-top: 0;
    font-size: 18px;
}

input,
select,
textarea,
button {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
}

textarea {
    resize: vertical;
    min-height: 70px;
}

button {
    border: none;
    background: #1976d2;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.tabs button {
    margin: 0;
    background: #ddd;
    color: #333;
}

.tabs button.active {
    background: #1976d2;
    color: white;
}

.list-item {
    background: #f8f9fc;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border-left: 4px solid #1976d2;
}

.list-item strong {
    font-size: 16px;
}

.amount {
    font-size: 17px;
    font-weight: bold;
    margin-top: 5px;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.actions button {
    margin: 0;
    flex: 1;
}

.edit-btn {
    background: #f39c12;
}

.delete-btn {
    background: #e74c3c;
}

.hidden {
    display: none;
}

.category-badge {
    display: inline-block;
    background: #e8f5e9;
    color: #2e7d32;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 5px;
}

.search-box {
    margin-bottom: 10px;
}

.empty {
    text-align: center;
    color: #777;
    padding: 20px;
}

@media (max-width: 500px) {
    .cards {
        grid-template-columns: repeat(3, 1fr);
    }

    .card-value {
        font-size: 14px;
    }

    .card-title {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Money Tracker</h1>

    <button
    id="chartBtn"
    style="width:auto;margin-top:10px;padding:8px 18px;"
>
    📊 চার্ট
    </button>
</header>
    <!-- ---------- CHART MODAL ---------- -->

<div
    id="chartModal"
    class="hidden"
    style="
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.55);
        z-index:100;
        padding:20px;
        overflow:auto;
    "
>

    <div
        style="
            background:white;
            max-width:600px;
            margin:30px auto;
            border-radius:16px;
            padding:18px;
        "
    >

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
            "
        >

            <h2 style="margin:0;">
                খরচের চার্ট
            </h2>

            <button
                id="closeChartBtn"
                style="
                    width:auto;
                    margin:0;
                    background:#e74c3c;
                    padding:8px 14px;
                "
            >
                ✕
            </button>

        </div>

        <div
            style="
                display:flex;
                gap:8px;
                margin-top:15px;
            "
        >

            <button
                id="dailyChartBtn"
                style="margin:0;"
            >
                দৈনিক
            </button>

            <button
                id="monthlyChartBtn"
                style="margin:0;background:#777;"
            >
                মাসিক
            </button>

            <button
                id="yearlyChartBtn"
                style="margin:0;background:#777;"
            >
                বার্ষিক
            </button>

        </div>

        <div
            id="chartArea"
            style="
                margin-top:20px;
                text-align:center;
            "
        >
        </div>

        <div
            id="chartLegend"
            style="margin-top:20px;"
        >
        </div>

    </div>

</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <div class="card-title">আজকের খরচ</div>
            <div class="card-value" id="todayExpense">₹0.00</div>
        </div>

        <div class="card">
            <div class="card-title">এই মাসের আয়</div>
            <div class="card-value" id="monthIncome">₹0.00</div>
        </div>

        <div class="card">
            <div class="card-title">ব্যালেন্স</div>
            <div class="card-value" id="balance">₹0.00</div>
        </div>

    </div>

    <div class="tabs">
        <button id="expenseTab" class="active">
            খরচ
        </button>

        <button id="incomeTab">
            আয়
        </button>
    </div>

    <div id="expenseSection" class="section">

        <h2>খরচ যোগ করুন</h2>

        <input
            type="date"
            id="expenseDate"
        >

        <select id="expenseCategory">
            <option value="">ক্যাটাগরি নির্বাচন করুন</option>
        </select>

        <input
            type="text"
            id="expenseItem"
            placeholder="কী কিনেছেন?"
        >

        <input
            type="number"
            id="expenseAmount"
            placeholder="টাকার পরিমাণ"
            min="0"
            step="0.01"
        >

        <textarea
            id="expenseNote"
            placeholder="নোট (ঐচ্ছিক)"
        ></textarea>

        <button id="saveExpenseBtn">
            খরচ যোগ করুন
        </button>

        <button
            id="cancelExpenseBtn"
            class="hidden"
            style="background:#777;"
        >
            বাতিল
        </button>

        <hr style="margin:20px 0;border:0;border-top:1px solid #ddd;">

        <input
            type="text"
            id="expenseSearch"
            class="search-box"
            placeholder="খরচ খুঁজুন..."
        >

        <div id="expenseList"></div>

    </div>

    <div id="incomeSection" class="section hidden">

        <h2>আয় যোগ করুন</h2>

        <input
            type="date"
            id="incomeDate"
        >

        <input
            type="text"
            id="incomeItem"
            placeholder="আয়ের নাম"
        >

        <input
            type="number"
            id="incomeAmount"
            placeholder="টাকার পরিমাণ"
            min="0"
            step="0.01"
        >

        <textarea
            id="incomeNote"
            placeholder="নোট (ঐচ্ছিক)"
        ></textarea>

        <button id="saveIncomeBtn">
            আয় যোগ করুন
        </button>

        <button
            id="cancelIncomeBtn"
            class="hidden"
            style="background:#777;"
        >
            বাতিল
        </button>

        <hr style="margin:20px 0;border:0;border-top:1px solid #ddd;">

        <input
            type="text"
            id="incomeSearch"
            class="search-box"
            placeholder="আয় খুঁজুন..."
        >

        <div id="incomeList"></div>

    </div>

</div>

    <script>

/* ---------- DATA ---------- */

let expenses = JSON.parse(
    localStorage.getItem("moneyTrackerExpenses") || "[]"
);

let incomes = JSON.parse(
    localStorage.getItem("moneyTrackerIncomes") || "[]"
);

let categories = JSON.parse(
    localStorage.getItem("moneyTrackerCategories") || "null"
);

if (!categories) {
    categories = [
        "বাজার",
        "সবজি",
        "মাছ",
        "মাংস",
        "চাল / ডাল",
        "যাতায়াত",
        "বিদ্যুৎ",
        "মোবাইল",
        "বাড়ি",
        "অন্যান্য"
    ];

    localStorage.setItem(
        "moneyTrackerCategories",
        JSON.stringify(categories)
    );
}

let editingExpenseId = null;
let editingIncomeId = null;

/* ---------- BASIC HELPERS ---------- */

function money(value) {
    return "₹" + Number(value || 0).toFixed(2);
}

function todayDate() {
    const d = new Date();

    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function currentMonth() {
    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0")
    );
}
        /* ---------- CATEGORY ---------- */

function populateCategorySelect() {
    const select = document.getElementById("expenseCategory");

    if (!select) return;

    select.innerHTML =
        '<option value="">ক্যাটাগরি নির্বাচন করুন</option>';

    categories.forEach(category => {
        const option = document.createElement("option");

        option.value = category;
        option.textContent = category;

        select.appendChild(option);
    });
}


/* ---------- SUMMARY ---------- */

function updateSummary() {
    const today = todayDate();
    const month = currentMonth();

    let todayExpenseTotal = 0;
    let monthIncomeTotal = 0;
    let allIncomeTotal = 0;
    let allExpenseTotal = 0;

    expenses.forEach(expense => {
        const amount = Number(expense.amount) || 0;

        allExpenseTotal += amount;

        if (expense.date === today) {
            todayExpenseTotal += amount;
        }
    });

    incomes.forEach(income => {
        const amount = Number(income.amount) || 0;

        allIncomeTotal += amount;

        if (income.date.startsWith(month)) {
            monthIncomeTotal += amount;
        }
    });

    const balance = allIncomeTotal - allExpenseTotal;

    document.getElementById("todayExpense").textContent =
        money(todayExpenseTotal);

    document.getElementById("monthIncome").textContent =
        money(monthIncomeTotal);

    document.getElementById("balance").textContent =
        money(balance);
}


/* ---------- DEFAULT DATE ---------- */

function setDefaultDates() {
    const today = todayDate();

    document.getElementById("expenseDate").value = today;
    document.getElementById("incomeDate").value = today;
}
        /* ---------- EXPENSE LIST ---------- */

function renderExpenses() {
    const list = document.getElementById("expenseList");
    const search = document.getElementById("expenseSearch").value
        .trim()
        .toLowerCase();

    list.innerHTML = "";

    let filtered = expenses.filter(expense => {
        const text = (
            expense.item +
            " " +
            expense.category +
            " " +
            (expense.note || "")
        ).toLowerCase();

        return text.includes(search);
    });

    filtered.sort((a, b) => {
        return b.date.localeCompare(a.date);
    });

    if (filtered.length === 0) {
        list.innerHTML =
            '<div class="empty">কোনো খরচ পাওয়া যায়নি।</div>';
        return;
    }

    filtered.forEach(expense => {

        const item = document.createElement("div");
        item.className = "list-item";

        item.innerHTML = `
            <strong>${escapeHtml(expense.item)}</strong>

            <div>
                <span class="category-badge">
                    ${escapeHtml(expense.category)}
                </span>
            </div>

            <div style="margin-top:6px;">
                📅 ${escapeHtml(expense.date)}
            </div>

            <div class="amount">
                ${money(expense.amount)}
            </div>

            ${
                expense.note
                    ? `<div style="margin-top:5px;color:#666;">
                        ${escapeHtml(expense.note)}
                       </div>`
                    : ""
            }

            <div class="actions">

                <button
                    class="edit-btn"
                    onclick="editExpense(${expense.id})"
                >
                    Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteExpense(${expense.id})"
                >
                    Delete
                </button>

            </div>
        `;

        list.appendChild(item);
    });
}
        /* ---------- INCOME LIST ---------- */

function renderIncomes() {
    const list = document.getElementById("incomeList");
    const search = document.getElementById("incomeSearch").value
        .trim()
        .toLowerCase();

    list.innerHTML = "";

    let filtered = incomes.filter(income => {
        const text = (
            income.item +
            " " +
            (income.note || "")
        ).toLowerCase();

        return text.includes(search);
    });

    filtered.sort((a, b) => {
        return b.date.localeCompare(a.date);
    });

    if (filtered.length === 0) {
        list.innerHTML =
            '<div class="empty">কোনো আয় পাওয়া যায়নি।</div>';
        return;
    }

    filtered.forEach(income => {

        const item = document.createElement("div");
        item.className = "list-item";

        item.innerHTML = `
            <strong>${escapeHtml(income.item)}</strong>

            <div style="margin-top:6px;">
                📅 ${escapeHtml(income.date)}
            </div>

            <div class="amount">
                ${money(income.amount)}
            </div>

            ${
                income.note
                    ? `<div style="margin-top:5px;color:#666;">
                        ${escapeHtml(income.note)}
                       </div>`
                    : ""
            }

            <div class="actions">

                <button
                    class="edit-btn"
                    onclick="editIncome(${income.id})"
                >
                    Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteIncome(${income.id})"
                >
                    Delete
                </button>

            </div>
        `;

        list.appendChild(item);
    });
}
        /* ---------- EXPENSE ACTIONS ---------- */

function saveExpense() {
    const date = document.getElementById("expenseDate").value;
    const category = document.getElementById("expenseCategory").value;
    const item = document.getElementById("expenseItem").value.trim();
    const amount = parseFloat(
        document.getElementById("expenseAmount").value
    );
    const note = document.getElementById("expenseNote").value.trim();

    if (!date || !category || !item || !amount || amount <= 0) {
        alert("দয়া করে প্রয়োজনীয় সব তথ্য দিন।");
        return;
    }

    if (editingExpenseId !== null) {

        const index = expenses.findIndex(
            expense => expense.id === editingExpenseId
        );

        if (index !== -1) {
            expenses[index] = {
                ...expenses[index],
                date,
                category,
                item,
                amount,
                note
            };
        }

    } else {

        expenses.push({
            id: Date.now(),
            date,
            category,
            item,
            amount,
            note
        });
    }

    localStorage.setItem(
        "moneyTrackerExpenses",
        JSON.stringify(expenses)
    );

    clearExpenseForm();
    renderExpenses();
    updateSummary();
}


function editExpense(id) {
    const expense = expenses.find(
        item => item.id === id
    );

    if (!expense) return;

    document.getElementById("expenseDate").value =
        expense.date;

    document.getElementById("expenseCategory").value =
        expense.category;

    document.getElementById("expenseItem").value =
        expense.item;

    document.getElementById("expenseAmount").value =
        expense.amount;

    document.getElementById("expenseNote").value =
        expense.note || "";

    editingExpenseId = id;

    document.getElementById("saveExpenseBtn").textContent =
        "খরচ আপডেট করুন";

    document.getElementById("cancelExpenseBtn")
        .classList.remove("hidden");
}


function deleteExpense(id) {
    if (!confirm("এই খরচটি মুছে ফেলতে চান?")) {
        return;
    }

    expenses = expenses.filter(
        expense => expense.id !== id
    );

    localStorage.setItem(
        "moneyTrackerExpenses",
        JSON.stringify(expenses)
    );

    renderExpenses();
    updateSummary();
}


function clearExpenseForm() {
    document.getElementById("expenseDate").value =
        todayDate();

    document.getElementById("expenseCategory").value =
        "";

    document.getElementById("expenseItem").value =
        "";

    document.getElementById("expenseAmount").value =
        "";

    document.getElementById("expenseNote").value =
        "";

    editingExpenseId = null;

    document.getElementById("saveExpenseBtn").textContent =
        "খরচ যোগ করুন";

    document.getElementById("cancelExpenseBtn")
        .classList.add("hidden");
}
        /* ---------- INCOME ACTIONS ---------- */

function saveIncome() {
    const date = document.getElementById("incomeDate").value;
    const item = document.getElementById("incomeItem").value.trim();
    const amount = parseFloat(
        document.getElementById("incomeAmount").value
    );
    const note = document.getElementById("incomeNote").value.trim();

    if (!date || !item || !amount || amount <= 0) {
        alert("দয়া করে প্রয়োজনীয় সব তথ্য দিন।");
        return;
    }

    if (editingIncomeId !== null) {

        const index = incomes.findIndex(
            income => income.id === editingIncomeId
        );

        if (index !== -1) {
            incomes[index] = {
                ...incomes[index],
                date,
                item,
                amount,
                note
            };
        }

    } else {

        incomes.push({
            id: Date.now(),
            date,
            item,
            amount,
            note
        });
    }

    localStorage.setItem(
        "moneyTrackerIncomes",
        JSON.stringify(incomes)
    );

    clearIncomeForm();
    renderIncomes();
    updateSummary();
}


function editIncome(id) {
    const income = incomes.find(
        item => item.id === id
    );

    if (!income) return;

    document.getElementById("incomeDate").value =
        income.date;

    document.getElementById("incomeItem").value =
        income.item;

    document.getElementById("incomeAmount").value =
        income.amount;

    document.getElementById("incomeNote").value =
        income.note || "";

    editingIncomeId = id;

    document.getElementById("saveIncomeBtn").textContent =
        "আয় আপডেট করুন";

    document.getElementById("cancelIncomeBtn")
        .classList.remove("hidden");
}


function deleteIncome(id) {
    if (!confirm("এই আয়টি মুছে ফেলতে চান?")) {
        return;
    }

    incomes = incomes.filter(
        income => income.id !== id
    );

    localStorage.setItem(
        "moneyTrackerIncomes",
        JSON.stringify(incomes)
    );

    renderIncomes();
    updateSummary();
}


function clearIncomeForm() {
    document.getElementById("incomeDate").value =
        todayDate();

    document.getElementById("incomeItem").value =
        "";

    document.getElementById("incomeAmount").value =
        "";

    document.getElementById("incomeNote").value =
        "";

    editingIncomeId = null;

    document.getElementById("saveIncomeBtn").textContent =
        "আয় যোগ করুন";

    document.getElementById("cancelIncomeBtn")
        .classList.add("hidden");
}
        /* ---------- TAB SWITCH ---------- */

function showExpenseTab() {
    document.getElementById("expenseSection")
        .classList.remove("hidden");

    document.getElementById("incomeSection")
        .classList.add("hidden");

    document.getElementById("expenseTab")
        .classList.add("active");

    document.getElementById("incomeTab")
        .classList.remove("active");
}


function showIncomeTab() {
    document.getElementById("incomeSection")
        .classList.remove("hidden");

    document.getElementById("expenseSection")
        .classList.add("hidden");

    document.getElementById("incomeTab")
        .classList.add("active");

    document.getElementById("expenseTab")
        .classList.remove("active");
}


/* ---------- EVENT LISTENERS ---------- */

document.getElementById("expenseTab")
    .addEventListener("click", showExpenseTab);

document.getElementById("incomeTab")
    .addEventListener("click", showIncomeTab);


document.getElementById("saveExpenseBtn")
    .addEventListener("click", saveExpense);


document.getElementById("saveIncomeBtn")
    .addEventListener("click", saveIncome);


document.getElementById("cancelExpenseBtn")
    .addEventListener("click", clearExpenseForm);


document.getElementById("cancelIncomeBtn")
    .addEventListener("click", clearIncomeForm);


/* ---------- SEARCH ---------- */

document.getElementById("expenseSearch")
    .addEventListener("input", renderExpenses);


document.getElementById("incomeSearch")
    .addEventListener("input", renderIncomes);
        /* ---------- HTML SAFETY ---------- */

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ---------- START ---------- */

populateCategorySelect();

setDefaultDates();

renderExpenses();

renderIncomes();

updateSummary();
        </script>

</body>
</html>
